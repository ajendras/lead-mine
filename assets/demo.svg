<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="LeadMine — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">LeadMine — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#d9c2a3">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 1.08s steps(24) 0.60s forwards" fill="#e5e7eb">npm install -g lead-mine</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.98s forwards" fill="#94a3b8">added 87 packages in 14s</text>
<text x="50" y="126" class="l" style="animation:show .01s 2.20s forwards" fill="#94a3b8">installed lead-mine@1.0.0 with bin &apos;lead-mine&apos;</text>
<text x="28" y="178" class="l" style="animation:show .01s 2.77s forwards"><tspan fill="#d9c2a3">❯</tspan></text><text x="50" y="178" class="l ty" style="animation:show .01s 2.77s forwards,type 2.20s steps(77) 2.77s forwards" fill="#e5e7eb">lead-mine scrape --category coffee --location &quot;Asheville, NC&quot; --limit 12 --s…</text>
<text x="50" y="204" class="l" style="animation:show .01s 5.27s forwards" fill="#94a3b8">Launching stealth browser...</text>
<text x="50" y="230" class="l" style="animation:show .01s 5.49s forwards" fill="#94a3b8">Found 12 businesses on Google Maps</text>
<text x="50" y="256" class="l" style="animation:show .01s 5.71s forwards" fill="#94a3b8">Enriched 9 websites with emails &amp; socials</text>
<text x="50" y="282" class="l" style="animation:show .01s 5.93s forwards" fill="#94a3b8">12 leads written to asheville-coffee.csv</text>
<text x="28" y="334" class="l" style="animation:show .01s 6.50s forwards"><tspan fill="#d9c2a3">❯</tspan></text><text x="50" y="334" class="l ty" style="animation:show .01s 6.50s forwards,type 1.26s steps(28) 6.50s forwards" fill="#e5e7eb">head -5 asheville-coffee.csv</text>
<text x="50" y="360" class="l" style="animation:show .01s 8.06s forwards" fill="#94a3b8">name,address,phone,website,email,rating</text>
<text x="50" y="386" class="l" style="animation:show .01s 8.28s forwards" fill="#94a3b8">&quot;Bean &amp; Barrel&quot;,&quot;123 Merrimon Ave, Asheville, NC&quot;,(828) 555-0123,https://bea…</text>
<text x="50" y="412" class="l" style="animation:show .01s 8.50s forwards" fill="#94a3b8">&quot;River Roasters&quot;,&quot;45 Broadway St, Asheville, NC&quot;,(828) 555-0987,https://rive…</text>
<text x="28" y="464" class="l" style="animation:show .01s 9.07s forwards"><tspan fill="#d9c2a3">❯</tspan></text><text x="50" y="464" class="l ty" style="animation:show .01s 9.07s forwards,type 2.20s steps(74) 9.07s forwards" fill="#e5e7eb">lead-mine scrape --category=&quot;bookstores&quot; --location=&quot;London&quot; --output=json</text>
<text x="50" y="490" class="l" style="animation:show .01s 11.57s forwards" fill="#94a3b8">Scraped 18 leads from Google + Yelp</text>
<text x="50" y="516" class="l" style="animation:show .01s 11.79s forwards" fill="#94a3b8">Exported to leads.json (18 entries)</text>
<g class="l" style="animation:show .01s 12.01s forwards"><text x="28" y="542" fill="#d9c2a3">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
